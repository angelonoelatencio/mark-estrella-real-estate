# Deploy an existing Next.js TypeScript application to Azure App Service

name: Build and deploy Next.js app to Azure Web App - realstateapp

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: realstateapp
  NODE_VERSION: "22.x"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build

      - name: Copy public assets
        run: |
          if [ -d "public" ]; then
            cp -r public .next/standalone/public
          fi

      - name: Copy Next.js static assets
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - name: Verify standalone deployment package
        run: |
          echo "Standalone package contents:"
          ls -la .next/standalone
          test -f .next/standalone/server.js

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: nextjs-app

      - name: Verify downloaded deployment package
        run: |
          echo "Downloaded package contents:"
          ls -la nextjs-app
          test -f nextjs-app/server.js

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D52BD9CD9E2345059932B196E6426AE5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2930B560C09E45B5B90BC6A2E9BC7943 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D655E4EDD85D44198BD5BD3865B8119D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: nextjs-app